<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samurai4K - Premium Media Player</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Theme colors for browser UI -->
    <meta name="theme-color" content="#4F46E5">
    <meta name="msapplication-TileColor" content="#4F46E5">
    
    <!-- Favicon and app icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://via.placeholder.com/32x32/4F46E5/white?text=S4K">
    <link rel="icon" type="image/png" sizes="16x16" href="https://via.placeholder.com/16x16/4F46E5/white?text=S4K">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/180x180/4F46E5/white?text=S4K">
    
    <!-- iOS specific meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Samurai4K">
    
    <!-- Windows specific meta tags -->
    <meta name="msapplication-config" content="browserconfig.xml">
</head>
<body>
    <div class="app">
        <!-- Navigation Header -->
        <header class="header">
            <div class="header-left">
                <h1 class="logo">Samurai4K</h1>
                <nav class="nav">
                    <button class="nav-item active" data-category="live-tv">
                        <svg class="nav-icon" viewBox="0 0 24 24">
                            <path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 10H3V8h18v8z"/>
                            <path d="M9 10v4l3-2-3-2z"/>
                        </svg>
                        Live TV
                    </button>
                    <button class="nav-item" data-category="movies">
                        <svg class="nav-icon" viewBox="0 0 24 24">
                            <path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/>
                        </svg>
                        Movies
                    </button>
                    <button class="nav-item" data-category="series">
                        <svg class="nav-icon" viewBox="0 0 24 24">
                            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
                        </svg>
                        Series
                    </button>
                </nav>
            </div>
            <div class="header-right">
                <button class="search-btn">
                    <svg viewBox="0 0 24 24">
                        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                </button>
                <div class="user-profile">
                    <img src="https://via.placeholder.com/32x32/4F46E5/white?text=U" alt="User" class="profile-pic">
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main">
            <!-- Video Player Section -->
            <div class="player-section" id="player-section" style="display: none;">
                <div class="video-container">
                    <video id="main-player" class="video-player" controls>
                        <source src="" type="application/x-mpegURL">
                        <source src="" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                    <div class="player-overlay">
                        <button class="close-player" id="close-player">×</button>
                        <div class="player-info">
                            <h3 id="now-playing-title">Now Playing</h3>
                            <p id="now-playing-description">Select content to start watching</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Content Browse Section -->
            <div class="browse-section" id="browse-section">
                <!-- Hero Section -->
                <div class="hero-section">
                    <div class="hero-content">
                        <h2>Featured Content</h2>
                        <p>Discover premium 4K content, live TV channels, and exclusive series</p>
                        <div class="hero-actions">
                            <button class="btn btn-primary" id="hero-play">
                                <svg viewBox="0 0 24 24">
                                    <path d="M8 5v14l11-7z"/>
                                </svg>
                                Play Now
                            </button>
                            <button class="btn btn-secondary">
                                <svg viewBox="0 0 24 24">
                                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                                </svg>
                                Add to Watchlist
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Content Grid -->
                <div class="content-section">
                    <div id="live-tv-content" class="content-category active">
                        <h3>Live TV Channels</h3>
                        <div class="content-grid" id="live-tv-grid">
                            <!-- Live TV content will be populated here -->
                        </div>
                    </div>

                    <div id="movies-content" class="content-category">
                        <h3>Movies</h3>
                        <div class="content-grid" id="movies-grid">
                            <!-- Movies content will be populated here -->
                        </div>
                    </div>

                    <div id="series-content" class="content-category">
                        <h3>TV Series</h3>
                        <div class="content-grid" id="series-grid">
                            <!-- Series content will be populated here -->
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Search Modal -->
        <div class="search-modal" id="search-modal">
            <div class="search-container">
                <input type="text" id="search-input" placeholder="Search for movies, series, channels..." autocomplete="off">
                <div class="search-results" id="search-results"></div>
            </div>
        </div>
    </div>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.10/dist/hls.min.js"></script>
    
    <!-- Application Scripts -->
    <script src="js/media-data.js"></script>
    <script src="js/player.js"></script>
    <script src="js/search.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
